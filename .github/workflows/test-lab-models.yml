name: Test Lab device catalog

# Prints the real, currently-available Firebase Test Lab Android models per
# API level -- the list DEVICE_MATRIX.md and device-matrix.yml need real model
# ids from instead of guesses (Test Lab's catalog changes over time). Doubles
# as the cheapest possible check that FIREBASE_TEST_LAB_SA_KEY and
# FIREBASE_PROJECT_ID authenticate and that the service account's role can
# reach Test Lab at all, without running (or spending quota on) a test.
#
# Manual only. Reads the same two secrets as device-matrix.yml.
on:
  workflow_dispatch:
  # TEMPORARY (storage probe): removed before the PR.
  push:
    branches: [ci/test-lab-models]

permissions:
  contents: read

jobs:
  list-models:
    name: List Test Lab models
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_TEST_LAB_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Show the quota and who we are
        run: |
          gcloud auth list
          gcloud config get-value project

      - name: Catalog per DEVICE_MATRIX.md API level (physical)
        run: |
          for api in 26 30 33 34 36; do
            echo "=================== API $api (physical) ==================="
            gcloud firebase test android models list \
              --filter="supportedVersionIds:$api AND form=PHYSICAL" || true
          done

      - name: Catalog per API level (virtual)
        run: |
          for api in 26 30 33 34 36; do
            echo "=================== API $api (virtual) ==================="
            gcloud firebase test android models list \
              --filter="supportedVersionIds:$api AND form=VIRTUAL" || true
          done

      - name: All physical models (to hand-pick a low-RAM one for cell 6)
        run: gcloud firebase test android models list --filter="form=PHYSICAL"

      # TEMPORARY: why can the service account not write to Test Lab's
      # results bucket? Prints who owns the bucket and tries a 1-byte write.
      - name: Probe results bucket
        continue-on-error: true
        run: |
          B=test-lab-10v629d88y5cs-ni0bb06p4thdu
          echo "--- our project number"
          gcloud projects describe "$(gcloud config get-value project 2>/dev/null)" --format="value(projectNumber)" || true
          echo "--- bucket metadata"
          gcloud storage buckets describe "gs://$B" --format="value(name,project_number,location,storage_class,uniform_bucket_level_access)" || true
          echo "--- list"
          gcloud storage ls "gs://$B/" 2>&1 | head -5 || true
          echo "--- 1-byte write"
          echo probe > /tmp/probe.txt
          gcloud storage cp /tmp/probe.txt "gs://$B/probe/probe.txt" && gcloud storage rm "gs://$B/probe/probe.txt"

