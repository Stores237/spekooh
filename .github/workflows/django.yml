name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least-privilege default: this workflow only checks out code, installs
# deps, and runs tests/checks — it never pushes, comments, or releases.
permissions:
  contents: read

jobs:
  test:
    name: backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spekooh
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # CACHES now points at Redis (see config/settings/base.py) and DRF's
      # guest-mint throttle reads/writes it on every request to that
      # endpoint — without this service those tests fail on connection
      # refused, not a throttle assertion.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/spekooh
      REDIS_URL: rediscache://localhost:6379/0

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: "pip"
        cache-dependency-path: backend/requirements/dev.txt
    - name: Install system dependencies (OCR)
      # pytesseract/pdf2image are Python wrappers around these CLI binaries —
      # pip installing the wrapper packages doesn't install the binaries
      # themselves. ubuntu-latest doesn't have either preinstalled.
      run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/dev.txt
    - name: Check for missing migrations
      # Catches model changes committed without their migration — the exact
      # gap that let two live endpoints 500 in dev after a field was added
      # without a corresponding migration ever being generated.
      working-directory: backend
      run: python manage.py makemigrations --check --dry-run
    - name: Lint
      working-directory: backend
      run: ruff check .
    - name: Run tests
      working-directory: backend
      run: pytest
