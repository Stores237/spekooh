name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spekooh
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/spekooh

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install system dependencies (OCR)
      # pytesseract/pdf2image are Python wrappers around these CLI binaries —
      # pip installing the wrapper packages doesn't install the binaries
      # themselves. ubuntu-latest doesn't have either preinstalled.
      run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/dev.txt
    - name: Run tests
      working-directory: backend
      run: pytest
