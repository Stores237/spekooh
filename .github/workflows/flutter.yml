name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
    - uses: actions/checkout@v7
    - uses: subosito/flutter-action@v2
      with:
        channel: "stable"
        flutter-version: "3.44.9"
        cache: true
    - name: Install dependencies
      run: flutter pub get
    - name: Analyze
      run: flutter analyze
    - name: Run tests
      run: flutter test
