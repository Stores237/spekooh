<!-- @dsCard group="Brand" viewport="700x170" name="Iconography" subtitle="Line icons (Lucide, CDN) — closest match to app glyphs; substitution" -->
<html><head><link rel="stylesheet" href="../styles.css"><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script><style>body{margin:0;padding:16px;font-family:var(--font-sans);background:var(--surface-bg);display:flex;gap:14px;flex-wrap:wrap}.chip{width:56px;height:56px;border-radius:var(--radius-chip);display:flex;align-items:center;justify-content:center}</style></head>
<body>
<div class="chip" style="background:var(--blue-100);color:var(--blue-600)"><i data-lucide="sigma"></i></div>
<div class="chip" style="background:var(--green-100);color:var(--green-600)"><i data-lucide="leaf"></i></div>
<div class="chip" style="background:var(--purple-100);color:var(--purple-500)"><i data-lucide="flask-conical"></i></div>
<div class="chip" style="background:var(--blue-100);color:var(--blue-600)"><i data-lucide="atom"></i></div>
<div class="chip" style="background:var(--amber-100);color:var(--amber-600)"><i data-lucide="trophy"></i></div>
<div class="chip" style="background:var(--blue-100);color:var(--blue-600)"><i data-lucide="download"></i></div>
<div class="chip" style="background:var(--blue-100);color:var(--blue-600)"><i data-lucide="message-circle"></i></div>
<div class="chip" style="background:var(--blue-100);color:var(--blue-600)"><i data-lucide="flame"></i></div>
<div class="chip" style="background:var(--blue-100);color:var(--text-tertiary)"><i data-lucide="lock"></i></div>
<script>lucide.createIcons()</script>
</body></html>
