      description: |-
        * `UNASSIGNED_PAPER` - No instructor accepted
        * `PAMPHLET_DISPUTE` - Pamphlet handover dispute
        * `PAMPHLET_EXPIRED` - Pamphlet ticket expired unredeemed
        * `WEBHOOK_ANOMALY` - Instructor webhook contradicted local state
        * `OTHER` - Other
