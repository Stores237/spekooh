  /api/papers/submissions/:
    get:
      operationId: papers_submissions_list
      parameters:
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: exam_type
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - AWAITING_MARKING_GUIDE
          - GUIDE_SUBMITTED
          - INSTRUCTOR_ACCEPTED
          - INSTRUCTOR_REJECTED
          - INSTRUCTOR_REQUEST_SENT
          - MERGED
          - PENDING_REVIEW
          - PUBLISHED
          - UNASSIGNED_ADMIN_QUEUE
        description: |-
          * `PENDING_REVIEW` - Pending review
          * `INSTRUCTOR_REQUEST_SENT` - Instructor request sent
          * `INSTRUCTOR_ACCEPTED` - Instructor accepted
          * `INSTRUCTOR_REJECTED` - Instructor rejected
          * `AWAITING_MARKING_GUIDE` - Awaiting marking guide
          * `GUIDE_SUBMITTED` - Guide submitted
          * `MERGED` - Merged
          * `PUBLISHED` - Published
          * `UNASSIGNED_ADMIN_QUEUE` - Unassigned — admin queue
      - in: query
        name: subject
        schema:
          type: integer
      - in: query
        name: submitted_by
        schema:
          type: string
          format: uuid
      tags:
      - papers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
