openapi: 3.0.3
info:
  title: Spekooh API
  version: 1.0.0
  description: Past-paper marketplace, instructor marking, credits, and pamphlet escrow.
paths:
  /api/admin-queue/flags/:
    get:
      operationId: admin_queue_flags_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - OTHER
          - PAMPHLET_DISPUTE
          - PAMPHLET_EXPIRED
          - UNASSIGNED_PAPER
          - WEBHOOK_ANOMALY
        description: |-
          * `UNASSIGNED_PAPER` - No instructor accepted
          * `PAMPHLET_DISPUTE` - Pamphlet handover dispute
          * `PAMPHLET_EXPIRED` - Pamphlet ticket expired unredeemed
          * `WEBHOOK_ANOMALY` - Instructor webhook contradicted local state
          * `OTHER` - Other
      - in: query
        name: status
        schema:
          type: string
          enum:
          - OPEN
          - RESOLVED
        description: |-
          * `OPEN` - Open
          * `RESOLVED` - Resolved
      tags:
      - admin-queue
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminFlagQueue'
          description: ''
  /api/admin-queue/flags/{id}/:
    get:
      operationId: admin_queue_flags_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this admin flag queue.
        required: true
      tags:
      - admin-queue
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFlagQueue'
          description: ''
  /api/admin-queue/flags/{id}/resolve/:
    post:
      operationId: admin_queue_flags_resolve_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this admin flag queue.
        required: true
      tags:
      - admin-queue
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminFlagQueue'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminFlagQueue'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminFlagQueue'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFlagQueue'
          description: ''
  /api/auth/guest/:
