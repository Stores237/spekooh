          type: string
          writeOnly: true
      required:
      - access
      - refresh
    UnlockRequest:
      type: object
      properties:
        paper_submission:
          type: integer
        phone_number:
          type: string
          maxLength: 20
        redeem_code:
          type: string
          maxLength: 20
      required:
      - paper_submission
      - phone_number
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        name:
          type: string
          maxLength: 150
        account_type:
          allOf:
          - $ref: '#/components/schemas/AccountTypeEnum'
          readOnly: true
        education_level:
          type: string
          maxLength: 80
        region:
          type: string
          maxLength: 80
        language_pref:
          $ref: '#/components/schemas/LanguageEnum'
      required:
      - account_type
      - id
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
