        per spec's "golden rule"); AllowAny + signature verification instead.
      tags:
      - instructors
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstructorWebhookEnvelope'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InstructorWebhookEnvelope'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InstructorWebhookEnvelope'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
