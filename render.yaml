# Render Blueprint for spekooh-staging — see RENDER_STAGING.md for the full
# deployment guide, including which values are owner action items (Supabase
# staging project, Render account, secrets) versus what's already handled
# here as code.
#
# This is a monorepo (app/ + backend/) — rootDir relocates the effective
# root Render builds from to backend/, and dockerfilePath/dockerContext
# below are resolved relative to *that* (rootDir), not the repo root —
# confirmed by a real failed deploy (2026-09-07): setting both to
# "backend/..." on top of rootDir: backend produced the literal path
# .../src/backend/backend (rootDir + dockerContext, compounded), which
# doesn't exist. Render's own Blueprint docs say the opposite (relative
# to the repo root, unaffected by rootDir) — that's simply wrong, or at
# least not what actually happens; trust this live error over the page.
services:
  - type: web
    name: spekooh-staging
    # Docker, not Render's native Python runtime (2026-09-07, real live
    # failure) — the native runtime blocks apt-get/OS-level package
    # installs entirely, so it could never provide the real
    # `tesseract`/`pdftoppm` binaries apps.papers.ocr needs (pytesseract/
    # pdf2image are thin wrappers around those CLI tools, not something
    # pip alone can install). See backend/Dockerfile's own docstring and
    # RENDER_STAGING.md for the full incident.
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    branch: main
    rootDir: backend
    # buildCommand/startCommand are not used for runtime: docker — the
    # Dockerfile's own RUN/CMD instructions replace both.
    healthCheckPath: /healthz/
    envVars:
      # PYTHON_VERSION is a native-runtime-only setting (picks the
      # buildpack's interpreter) — meaningless for runtime: docker, where
      # the version instead comes from the Dockerfile's own `FROM
      # python:3.13-slim`. Left unset here rather than kept as dead config.
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: 2
      # No real email provider exists yet (see TODOS.md) — base.py's real
      # default (SMTP, no host configured) crashes every send_mail call
      # with ConnectionRefusedError, found live: it 500'd every single
      # staging registration. Console backend just logs the email instead
      # of pretending to deliver it — an honest stand-in for staging only,
      # never set this way for real production.
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      # Everything below is a real secret/value that must be set by hand in
      # the Render dashboard (Environment tab) — never committed here. See
      # RENDER_STAGING.md §4 for the full list and where each one comes from.
      - key: DATABASE_URL
        sync: false
      # Found missing live (2026-09-02): this wasn't declared here at all,
      # so nothing prompted setting it — DEFAULT_THROTTLE_RATES (login,
      # register, guest signup, password reset) all silently 500'd with
      # ConnectionError: Error 111 connecting to localhost:6379 (the
      # code's own local-dev fallback when this is unset). A real Redis
      # instance's connection string, e.g. Render's own Key Value add-on.
      - key: REDIS_URL
        sync: false
      # AWS_STORAGE_BUCKET_NAME and AWS_S3_REGION_NAME are the two easiest
      # to get wrong (found live, 2026-09-02): the former is easy to skip
      # entirely (uploads then silently fall back to local disk with no
      # error — see presign_paper_upload's own not-configured branch), and
      # the latter needs a real AWS-style region code from Supabase's own
      # Storage → S3 Connection panel (e.g. "eu-west-1") — NOT the bucket
      # name; a wrong region breaks S3 SigV4 request signing outright.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: TASK_TRIGGER_TOKEN
        sync: false
      # Optional — from https://aistudio.google.com/apikey. Without it,
      # apps.ai's generate_pending_artifacts fails each pending artifact
      # cleanly (AIUnavailable) instead of crashing; the feature just
      # stays inert until this is set. See RENDER_STAGING.md §4.
      - key: GEMINI_API_KEY
        sync: false
      # Twilio (2026-09-14) — phone verification (apps.core.sms, via a real
      # Verify Service, no purchased number needed) + optional SMS
      # notifications (apps.notifications.services.notify(sms=True), which
      # DOES need TWILIO_MESSAGING_FROM_NUMBER — a real purchased number/
      # Messaging Service, absent here same as production; see
      # RENDER_PRODUCTION.md). Both features no-op safely when unset.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: TWILIO_MESSAGING_FROM_NUMBER
        sync: false
      # Free-tier web services have no Shell tab and no one-off Jobs (both
      # paid-only), so the usual `createsuperuser` has nowhere interactive
      # to run — the Dockerfile's own CMD runs
      # apps.accounts.management.commands.ensure_superuser instead,
      # idempotently, on every container start.
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  # spekooh-production (2026-09-13) — a real, separate service, not staging
  # promoted in place. Same Dockerfile/build as spekooh-staging (identical
  # code, identical runtime dependencies) — everything that differs is
  # below, either in this block or in the env vars set by hand in the
  # dashboard (RENDER_PRODUCTION.md has the full list and where each one
  # comes from; never the staging project's own values — see that doc's
  # own opening section for why).
  - type: web
    name: spekooh-production
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    # Off the free tier on purpose (release-roadmap P4) — free-tier
    # spin-down (15 min idle -> ~1 min cold start) is fine for testers who
    # know to wait and not fine for a real user's first impression. Starter
    # is Render's cheapest always-on plan; a real card on the Render
    # account is required before this Blueprint apply will actually
    # provision it — that step is the owner's, not something this repo's
    # code can do for you.
    plan: starter
    region: frankfurt
    branch: main
    rootDir: backend
    # Every push to main still auto-deploys spekooh-staging above. This
    # service deliberately does NOT — merging to main is "ready for
    # testers," not "ready for real users." Promote a verified commit by
    # clicking Manual Deploy -> Deploy latest commit on this service in
    # the Render dashboard once you've actually checked it on staging
    # first, not automatically the moment CI goes green.
    autoDeploy: false
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # Real load test against spekooh-staging (2026-09-14, MVP exit
      # criteria — see MVP_SIGNOFF_CHECKLIST.md): with staging's
      # WEB_CONCURRENCY=2, only 40 concurrent reads to an unthrottled,
      # read-only endpoint already produced a p95 of 13s and a 32s max;
      # 8 concurrent registrations (bcrypt is deliberately CPU-slow) hit a
      # 22s max. No errors/5xx — the app didn't break, it just queued
      # behind too few workers. Production is on the paid starter plan
      # specifically for more headroom than free-tier gives (see this
      # service's own top comment) — doubled here to actually use it,
      # not left at staging's deliberately modest value. Revisit with
      # real Sentry/latency data once production has actual traffic,
      # rather than guessing further from one synthetic run.
      - key: WEB_CONCURRENCY
        value: 4
      # Unlike spekooh-staging above, EMAIL_BACKEND is NOT pinned to the
      # console backend here — left sync: false so it must be a deliberate
      # choice. Left unset entirely, base.py's own real default (SMTP,
      # Django's global localhost:25) takes over and every registration/
      # password-reset send_mail crashes loudly — the same honest "fail
      # rather than pretend" behavior base.py already documents, and
      # correct for production: a real user silently never receiving a
      # verification email is worse than that signup failing visibly. See
      # RENDER_PRODUCTION.md for what setting this to a real provider
      # (and the new EMAIL_HOST/EMAIL_HOST_USER/EMAIL_HOST_PASSWORD/
      # EMAIL_PORT/EMAIL_USE_TLS vars config/settings/base.py now reads)
      # requires — this must be resolved before real users hit this
      # service, not left as a staging-style stand-in.
      - key: EMAIL_BACKEND
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      # The production Supabase project's own pooler string (port 6543) —
      # never spekooh-staging's. See RENDER_PRODUCTION.md.
      - key: DATABASE_URL
        sync: false
      # A separate Key Value instance from staging's — rate-limit throttle
      # keys are scoped by (scope, client IP/user), not by environment, so
      # a shared instance would let staging load-testing contribute to a
      # real user's own throttle counters if they ever shared an IP (e.g.
      # NAT/carrier-grade NAT, common on Cameroonian mobile networks).
      - key: REDIS_URL
        sync: false
      # The production Supabase project's own Storage bucket + S3
      # credentials — never staging's. See RENDER_PRODUCTION.md.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      # No TASK_TRIGGER_TOKEN/run_task here on purpose — RENDER_STAGING.md
      # §6 already calls this staging-only ("an HTTP endpoint that mutates
      # instructor/pamphlet/account state on any correctly-tokened request
      # is an availability and security liability under real load").
      # Production's background jobs are the real Render Cron Job services
      # below instead — no public endpoint, nothing to guess a token for.
      - key: SENTRY_DSN
        sync: false
      - key: DJANGO_ADMIN_EMAILS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Twilio (2026-09-14) — own account for production, never staging's
      # credentials (same "never reuse a staging value" rule as everything
      # else in this file — see RENDER_PRODUCTION.md §0). Phone verification
      # (TWILIO_VERIFY_SERVICE_SID) works with no purchased number; SMS
      # notifications (TWILIO_MESSAGING_FROM_NUMBER) need one and this
      # account doesn't have one yet — no-ops safely until it does.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: TWILIO_MESSAGING_FROM_NUMBER
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  # Production's real background-task mechanism (RENDER_STAGING.md §6,
  # Option 3) — a native Render Cron Job per command instead of staging's
  # HTTP-trigger + cron-job.org workaround. Same image, same code; each
  # just runs one management command to completion and exits. Cadence
  # matches scripts/crontab.example, with process-pending-ocr kept at the
  # same 10-minute floor staging's own real incident (RENDER_STAGING.md
  # §6, "part 5") found necessary to stay clear of free-tier idle-sleep —
  # moot for an always-on Starter plan, but there's no reason to run it
  # more often than that until real load says otherwise.
  - type: cron
    name: spekooh-production-instructor-timeouts
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    dockerCommand: python manage.py process_instructor_timeouts
    plan: starter
    region: frankfurt
    branch: main
    rootDir: backend
    schedule: "*/15 * * * *"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

  - type: cron
    name: spekooh-production-pamphlet-expiry
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    dockerCommand: python manage.py process_pamphlet_expiry
    plan: starter
    region: frankfurt
    branch: main
    rootDir: backend
    schedule: "0 * * * *"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

  - type: cron
    name: spekooh-production-prune-guest-accounts
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    dockerCommand: python manage.py prune_stale_guest_accounts
    plan: starter
    region: frankfurt
    branch: main
    rootDir: backend
    schedule: "5 * * * *"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

  - type: cron
    name: spekooh-production-ai-artifacts
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    dockerCommand: python manage.py generate_pending_artifacts
    plan: starter
    region: frankfurt
    branch: main
    rootDir: backend
    schedule: "*/10 * * * *"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: cron
    name: spekooh-production-pending-ocr
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    dockerCommand: python manage.py process_pending_ocr
    plan: starter
    region: frankfurt
    branch: main
    rootDir: backend
    schedule: "*/10 * * * *"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
