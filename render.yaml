# Render Blueprint for spekooh-staging — see RENDER_STAGING.md for the full
# deployment guide, including which values are owner action items (Supabase
# staging project, Render account, secrets) versus what's already handled
# here as code.
#
# This is a monorepo (app/ + backend/) — rootDir points every build/start
# command at the Django project.
services:
  - type: web
    name: spekooh-staging
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    rootDir: backend
    buildCommand: "./build.sh"
    # DJANGO_SETTINGS_MODULE must be prod (not the config/wsgi.py default of
    # dev) or ALLOWED_HOSTS/CSRF_TRUSTED_ORIGINS/SECURE_SSL_REDIRECT never
    # take effect — see config/settings/prod.py.
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-2}"
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: 2
      # No real email provider exists yet (see TODOS.md) — base.py's real
      # default (SMTP, no host configured) crashes every send_mail call
      # with ConnectionRefusedError, found live: it 500'd every single
      # staging registration. Console backend just logs the email instead
      # of pretending to deliver it — an honest stand-in for staging only,
      # never set this way for real production.
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      # Everything below is a real secret/value that must be set by hand in
      # the Render dashboard (Environment tab) — never committed here. See
      # RENDER_STAGING.md §4 for the full list and where each one comes from.
      - key: DATABASE_URL
        sync: false
      # Found missing live (2026-09-02): this wasn't declared here at all,
      # so nothing prompted setting it — DEFAULT_THROTTLE_RATES (login,
      # register, guest signup, password reset) all silently 500'd with
      # ConnectionError: Error 111 connecting to localhost:6379 (the
      # code's own local-dev fallback when this is unset). A real Redis
      # instance's connection string, e.g. Render's own Key Value add-on.
      - key: REDIS_URL
        sync: false
      # AWS_STORAGE_BUCKET_NAME and AWS_S3_REGION_NAME are the two easiest
      # to get wrong (found live, 2026-09-02): the former is easy to skip
      # entirely (uploads then silently fall back to local disk with no
      # error — see presign_paper_upload's own not-configured branch), and
      # the latter needs a real AWS-style region code from Supabase's own
      # Storage → S3 Connection panel (e.g. "eu-west-1") — NOT the bucket
      # name; a wrong region breaks S3 SigV4 request signing outright.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: TASK_TRIGGER_TOKEN
        sync: false
      # Optional — from https://aistudio.google.com/apikey. Without it,
      # apps.ai's generate_pending_artifacts fails each pending artifact
      # cleanly (AIUnavailable) instead of crashing; the feature just
      # stays inert until this is set. See RENDER_STAGING.md §4.
      - key: GEMINI_API_KEY
        sync: false
      # Free-tier web services have no Shell tab and no one-off Jobs (both
      # paid-only), so the usual `createsuperuser` has nowhere interactive
      # to run — build.sh runs apps.accounts.management.commands
      # .ensure_superuser instead, idempotently, on every deploy.
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
