<html><head><link rel="stylesheet" href="../../styles.css"><script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:18px;background:var(--surface-bg);font-family:var(--font-sans)}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { BottomNav, SegmentedTabs } = window.KawloSpekoohDesignSystem_10ffa8;
const Ic=({name,size=20,style})=>{const p=name.replace(/(^\w|-\w)/g,m=>m.replace('-','').toUpperCase());const nodes=(window.lucide&&window.lucide.icons[p])||[];return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style}>{nodes.map((n,i)=>React.createElement(n[0],{key:i,...n[1]}))}</svg>;};
function App(){
  const [active,setActive]=React.useState(0);
  const [tab,setTab]=React.useState(0);
  return <div style={{display:'flex',flexDirection:'column',gap:14}}>
    <SegmentedTabs options={['All','Sciences','Arts','Commercial']} active={tab} onChange={setTab}/>
    <div style={{borderRadius:'var(--radius-lg)',overflow:'hidden',boxShadow:'var(--shadow-card)'}}>
      <BottomNav active={active} onChange={setActive} items={[
        {icon:<Ic name="home"/>,label:'Home'},
        {icon:<Ic name="file-text"/>,label:'Papers'},
        {icon:<Ic name="sparkles" style={{color:'#fff'}}/>,center:true},
        {icon:<Ic name="message-circle"/>,label:'Forum'},
        {icon:<Ic name="zap"/>,label:'Quizzes'}
      ]}/>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
